version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: deal_db
    environment:
      POSTGRES_USER: deal_user
      POSTGRES_PASSWORD: deal_password
      POSTGRES_DB: deal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deal_user"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
